# Storeglance Agent — Production. Installed as /etc/nginx/sites-enabled/ai.storeglance.com.conf by
# deploy/setup-server.sh, which only installs it once the certificate exists:
#
#     certbot certonly --nginx --cert-name ai.storeglance.com -d ai.storeglance.com #         --deploy-hook "systemctl reload nginx"
#
# certbot does NOT edit this file; renewals only swap the cert files.
# DNS: A record straight to this host (not proxied through Cloudflare). nginx.conf
# enables Cloudflare origin-pull for the whole server, so this 443 block must
# turn it off (ssl_verify_client off) or every request fails with 400.

server {
    listen 80;
    server_name ai.storeglance.com;
    return 301 https://ai.storeglance.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.storeglance.com;

    ssl_verify_client off; # direct site (not behind Cloudflare origin-pull)
    ssl_certificate     /etc/letsencrypt/live/ai.storeglance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.storeglance.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/ai.storeglance.com/web;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # API — the app serves from its root; /api/ is stripped (trailing slash).
    # Streaming (SSE) and websockets: no buffering, upgrade headers, long reads.
    location /api/ {
        proxy_pass http://127.0.0.1:8130/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
        proxy_buffering off;
        proxy_cache off;
    }

    # Embeddable chat widget (bot/widget.js, bot/embed.js and its API).
    location ^~ /bot/ {
        proxy_pass http://127.0.0.1:8130/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8130/health;
        proxy_set_header Host $host;
    }

    # The Angular app (Agent.Web). index.html maps to the hashed bundles:
    # never cache it; the hashed bundles are immutable.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location ~* ^/[^/]+\.(?:js|css|woff2?|ttf|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ^~ /.well-known/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
