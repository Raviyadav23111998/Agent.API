name: Build & Deploy

# main → ai.storeglance.com (prod), uat → uat-ai.storeglance.com (uat).
# Ships Agent.API with Agent.Core under core/ and runs deploy/deploy.sh on the
# server, which installs requirements into the environment's venv, swaps the
# tree in, restarts both services and rolls back if /health fails.
#
# Repository secrets:
#   DEPLOY_HOST      server hostname / IP
#   SSH_DEPLOY_KEY   private key authorised for root on DEPLOY_HOST
#   SSH_KNOWN_HOSTS  output of `ssh-keyscan -t ed25519 <DEPLOY_HOST>`
#
# GitHub-hosted runners only: this repository is public, and a self-hosted
# runner would execute pull-request code from forks on the server.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ "main", "uat" ]
  pull_request:
    branches: [ "main", "uat" ]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    name: Python Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Agent.Core
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/Agent.Core
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          path: core

      - name: Resolve environment
        id: env
        run: |
          case "${GITHUB_BASE_REF:-${GITHUB_REF#refs/heads/}}" in
            main) echo "name=prod" >> "$GITHUB_OUTPUT" ;;
            *)    echo "name=uat"  >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile check
        run: python -m compileall -q api gateway main.py core/core core/brain core/client core/tools core/agents

      - name: Package
        if: github.event_name != 'pull_request'
        run: |
          rm -rf core/.git
          tar --exclude='.git' --exclude='.github' --exclude='__pycache__' -czf "$RUNNER_TEMP/agent-api.tar.gz" .
          tar -czf "$RUNNER_TEMP/kit.tar.gz" deploy migrations

      - name: SSH
        if: github.event_name != 'pull_request'
        env:
          KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          KNOWN: ${{ secrets.SSH_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          d="$RUNNER_TEMP/ssh"; mkdir -p "$d" && chmod 700 "$d"
          printf '%s\n' "$KEY"   > "$d/key";  chmod 600 "$d/key"
          printf '%s\n' "$KNOWN" > "$d/known_hosts"
          echo "SSH_DIR=$d" >> "$GITHUB_ENV"
          echo "SERVER=root@$HOST" >> "$GITHUB_ENV"
          echo "SSH_OPTS=-i $d/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$d/known_hosts -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20" >> "$GITHUB_ENV"

      - name: Deploy
        if: github.event_name != 'pull_request'
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
        run: |
          scp $SSH_OPTS "$RUNNER_TEMP/agent-api.tar.gz" "$RUNNER_TEMP/kit.tar.gz" "$SERVER:/tmp/"
          ssh $SSH_OPTS "$SERVER" "set -e
            rm -rf /opt/storeglance-agent/src && mkdir -p /opt/storeglance-agent/src
            tar -xzf /tmp/kit.tar.gz -C /opt/storeglance-agent/src
            chmod 755 /opt/storeglance-agent/src/deploy/*.sh /opt/storeglance-agent/src/deploy/db/*.sh
            /opt/storeglance-agent/src/deploy/deploy.sh $ENV_NAME /tmp/agent-api.tar.gz"

      - name: Remove SSH key
        if: always()
        run: '[ -n "${SSH_DIR:-}" ] && rm -rf "$SSH_DIR" || true'
